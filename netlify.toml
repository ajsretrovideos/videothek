# Netlify-Konfiguration – statische Seite, kein Build nötig.
# movies.json wird lokal oder von GitHub Actions erzeugt und mitcommittet.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
